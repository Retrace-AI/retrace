# Retrace starter config. Copy to ~/.retrace/config.toml.
# Ships with a free, no-key model (GPT-OSS 20B via Pollinations) so it works out
# of the box. Add your own provider any time via `retrace` -> /model -> "Add
# custom model" for speed, privacy, and stronger models.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Active model + provider. model_provider must point at the local proxy provider
# (not the built-in "openai" one) so Retrace does NOT show the OpenAI sign-in
# screen — the local proxy needs no OpenAI auth.
model = "gpt-oss-20b"
model_provider = "lumenatech"

# The retrace launcher rewrites these base_url values to the local proxy port at
# startup, so you normally do not edit model_providers by hand. name/env_key/
# wire_api must be present — a partial provider (base_url only) fails to load.
[model_providers.lumenatech]
name = "Retrace Local Proxy"
base_url = "http://127.0.0.1:48765/v1"
env_key = "RETRACE_LOCAL_API_KEY"
wire_api = "responses"

[model_providers.openrouter]
name = "OpenRouter via Local Proxy"
base_url = "http://127.0.0.1:48765/v1"
env_key = "RETRACE_LOCAL_API_KEY"
wire_api = "responses"

[tui]
status_line = ["model-with-reasoning", "permissions", "context-remaining", "context-window-size", "total-input-tokens", "total-output-tokens", "total-cached-tokens", "task-progress"]
status_line_use_colors = true
