[package]
name = "codex-realtime-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_realtime_webrtc"
path = "src/lib.rs"
test = false
doctest = false

# Realtime voice (WebRTC) is opt-in behind the `voice` feature. It is OFF by
# default because it pulls in libwebrtc/webrtc-sys, whose bundled C++ does not
# compile against newer macOS SDK libc++ toolchains (breaks CI) and adds
# significant build time and binary size. Build with `--features voice` to
# re-enable native realtime voice on macOS.
[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
default = []
voice = ["dep:libwebrtc"]

[target.'cfg(target_os = "macos")'.dependencies]
libwebrtc = { version = "0.3.26", git = "https://github.com/juberti-oai/rust-sdks.git", rev = "e2d1d1d230c6fc9df171ccb181423f957bb3c1f0", optional = true }

[lints]
workspace = true
